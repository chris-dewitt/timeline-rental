[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timeline-rental"
version = "0.1.0"
description = "Neon noir multiverse game — damaged VHS timelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pygame-ce>=2.4",
  "qiskit>=1.0",
  "qiskit-aer>=0.13",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.scripts]
timeline-rental = "timeline_rental.game.engine:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
